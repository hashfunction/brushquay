name: Bristlune Windows product qualification
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Run reviewed dual installed release qualification and unsigned Store export'
        type: boolean
        required: false
        default: false
  push:
    branches: [codex/brushquay]
permissions:
  contents: read
jobs:
  private-sdk-inputs:
    permissions:
      contents: write
    uses: ./.github/workflows/private-sdk-fetch.yml
    secrets:
      BRISTLUNE_SDK_TRANSFER_KEY: ${{ secrets.BRISTLUNE_SDK_TRANSFER_KEY }}
  windows-x64:
    needs: private-sdk-inputs
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Test locked input handling
        shell: pwsh
        run: |
          python -m unittest discover -s build-tools/ci-scripts/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency tests failed.' }
          python -m unittest discover -s packaging/windows/msix/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'MSIX source validation tests failed.' }
          python -m unittest discover -s packaging/windows/qualification -v
          if ($LASTEXITCODE -ne 0) { throw 'Installed qualification safety tests failed.' }
          ./packaging/windows/qualification/test_input_guard.ps1
          ./packaging/windows/qualification/test_module_evidence.ps1
          ./packaging/windows/qualification/test_observer_arguments.ps1
          ./packaging/windows/qualification/test_workflow_observations.ps1
          ./packaging/windows/qualification/test_display_modes.ps1
          ./packaging/windows/qualification/test_qualify.ps1
          ./packaging/windows/qualification/test_operation_scope.ps1
          ./packaging/windows/qualification/test_release_identity.ps1
      - name: Verify native Appx host before compiling
        shell: powershell
        run: |
          ./packaging/windows/qualification/test_installer_host.ps1
          ./packaging/windows/qualification/test_input_guard.ps1
          ./packaging/windows/qualification/test_module_evidence.ps1
          ./packaging/windows/qualification/test_observer_arguments.ps1
          ./packaging/windows/qualification/test_workflow_observations.ps1
          ./packaging/windows/qualification/test_display_modes.ps1
          ./packaging/windows/qualification/test_qualify.ps1
          ./packaging/windows/qualification/test_operation_scope.ps1
          ./packaging/windows/qualification/test_release_identity.ps1
      - name: Refuse unreviewed release inputs before compiling
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        shell: powershell
        run: ./packaging/windows/msix/release.ps1 -Python python -PreflightOnly
      - name: Download only this run's encrypted private inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Bristlune-encrypted-SDK-${{ github.run_id }}-${{ github.run_attempt }}
          path: .brushquay/encrypted-sdk-transfer
      - name: Authenticate original private inputs into the locked cache
        shell: pwsh
        env:
          BRISTLUNE_SDK_TRANSFER_KEY: ${{ secrets.BRISTLUNE_SDK_TRANSFER_KEY }}
        run: |
          node build-tools/ci-scripts/private_sdk_transfer.cjs seed
          if ($LASTEXITCODE -ne 0) { throw 'Original private input preseed failed.' }
      - name: Fetch and verify immutable dependencies
        shell: pwsh
        run: ./build-tools/ci-scripts/fetch-locked-windows-deps.ps1 -Python python
      - name: Exercise the exact locked PE import reader
        shell: pwsh
        run: |
          $env:BRISTLUNE_TEST_PE_READER = (Resolve-Path '.brushquay/locked/tools/llvm/bin/llvm-readobj.exe').Path
          try {
            python -m unittest discover -s packaging/windows/qualification -p test_pe_imports.py -v
            if ($LASTEXITCODE -ne 0) { throw 'Actual locked PE reader fixture failed.' }
          } finally { Remove-Item Env:BRISTLUNE_TEST_PE_READER }
      - name: Compile and test the native Qt 6 product
        shell: pwsh
        run: ./build-tools/ci-scripts/build-locked-windows.ps1 -Python python -Jobs 2
      - name: Qualify disposable installed painting and export
        if: github.event_name != 'workflow_dispatch' || inputs.release != true
        shell: powershell
        run: ./packaging/windows/qualification/qualify.ps1 -Python python
      - name: Qualify both reviewed installed identities and export unsigned Store package
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        shell: powershell
        run: ./packaging/windows/msix/release.ps1 -Python python
      - name: Upload independently qualified unsigned Store submission
        if: success() && github.event_name == 'workflow_dispatch' && inputs.release == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Bristlune-Store-1.0.1.0-x64
          path: |
            .brushquay/store-output/Bristlune_1.0.1.0_x64.msix
            .brushquay/store-output/store-export.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Preserve metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Bristlune-Windows-foundation-qualification
          path: |
            .brushquay/evidence/**/*.json
            .brushquay/evidence/**/*.log
            .brushquay/evidence/**/*.xml
            .brushquay/evidence/**/*.kws
            .brushquay/evidence/**/*.png
            .brushquay/qualification/**/sdk-*.log
            .brushquay/qualification/**/sdk-tools.json
            .brushquay/qualification/**/package-record.json
            .brushquay/qualification/**/release-record.json
            .brushquay/build/product-test-reports/*.xml
            .brushquay/build/product-test-reports/*.log
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
